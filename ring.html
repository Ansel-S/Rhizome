<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhizome · Routing…</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="assets/css/ring.css">
</head>
<body>

<main>
  <header class="hdr">
    <span class="hdr-logo">🌿 RHIZOME</span>
    <span class="hdr-dir" id="dir-label">Record</span>
  </header>

  <article class="win" role="status" aria-live="polite" aria-label="Routing to next node">

    <!-- ── Registry card ─────────────────────────────────────────────────── -->
    <div class="card">

      <div class="card-row field">
        <span class="field-key">NODE</span>
        <span class="field-val" id="f-name" aria-label="Destination site name">…</span>
        <!-- Peer badge (hidden by default) -->
        <span class="peer-badge" id="f-peer" hidden aria-label="Federated peer node">PEER</span>
      </div>

      <div class="card-row field">
        <span class="field-key">ADDR</span>
        <span class="field-val mono" id="f-ip" aria-hidden="true">…</span>
      </div>

      <div class="card-row field">
        <span class="field-key">COORD</span>
        <span class="field-val mono" id="f-coord" aria-hidden="true">…</span>
      </div>

      <div class="card-row field">
        <span class="field-key">URL</span>
        <span class="field-val mono small" id="f-url">…</span>
      </div>

      <div class="card-row field">
        <span class="field-key">BIO</span>
        <span class="field-val" id="f-bio">…</span>
      </div>

      <!-- Tags row — hidden until populated by ring.js -->
      <div class="card-row field" id="tags-row" hidden>
        <span class="field-key">TAGS</span>
        <span class="field-val" id="f-tags"></span>
      </div>

      <div class="card-row field">
        <span class="field-key">STATUS</span>
        <span class="field-val field-status" id="f-status">ROUTING</span>
      </div>

    </div>

    <!-- ── Progress bar ──────────────────────────────────────────────────── -->
    <div class="bar-wrap">
      <progress id="bar" max="100" value="0" aria-label="Routing progress"></progress>
      <span class="pct" id="pct" aria-hidden="true">0%</span>
    </div>

    <!-- ── Action row ────────────────────────────────────────────────────── -->
    <div class="action-row">
      <button
        id="cancel-redirect"
        class="btn-cancel"
        type="button"
        hidden
        aria-label="Cancel automatic redirect">
        ✕ Cancel redirect
      </button>
      <a
        id="visit-link"
        class="btn-visit"
        href="#"
        hidden
        target="_blank"
        rel="noopener noreferrer">
        Visit site →
      </a>
    </div>

    <!-- ── Stamp ─────────────────────────────────────────────────────────── -->
    <footer class="stamp">
      <span>ID: <code id="s-id">—</code></span>
      <span><time id="s-time" datetime="">—</time></span>
    </footer>

  </article>
</main>

<script type="module" src="src/ring.js"></script>
</body>
</html>
